pipeline:
  input:
    directory: ./data/in/raw/
    book: birdsEuropeIVGoul
    pages: [278]
  output:
    directory: ./data/out/processed/
  steps:
    - step: FixOrientationStep
      input: initial_image
      output: oriented_image
    - step: SemanticIllustrationMaskStep
      input: oriented_image
      output: protected_artwork_mask
      parameters:
        model_path: ./data/models/birefnet-general-lite.onnx
        device: auto
        input_size: 1024
        threshold: 0.35
    - step: AutomaticTextCleanupStep
      input: oriented_image
      output: text_cleaned_image
      parameters:
        min_confidence: 0.8
        max_ring_std: 25
        max_ring_edges: 0.1
    - step: GrayscaleStep
      input: text_cleaned_image
      output: grayscale_image
    - step: FindSubjectStep
      input: grayscale_image
      output: subject_mask
      parameters:
        threshold: 0.5
        shift: 50
        method: source_edges
        detection_max_size: 1600
        edge_threshold: 6
        edge_close_kernel: 7
        min_component_area_ratio: 0.0008
        fill_holes: true
    - step: PaperBalanceStep
      input: text_cleaned_image
      mask: subject_mask
      output: reduced_yellow_image
      parameters:
        target_white: 245
        max_gain: 1.1
        local_strength: 0.5
        max_local_shift: 10
        highlight_knee: 220
    - step: BilateralFilterStep
      input: reduced_yellow_image
      output: bilateral_filtered_image
      parameters:
        diameter: 9
        sigma_color: 75
        sigma_space: 75
    - step: BrightnessContrastStep
      input: bilateral_filtered_image
      mask: subject_mask
      output: bright_contrast_image
      parameters:
        brightness: -5
        contrast: 15
        soft_highlights: true
    - step: FadePaintedWashStep
      input: bright_contrast_image
      mask: subject_mask
      output: wash_reduced_image
      parameters:
        protected_mask: protected_artwork_mask
        strength: 1.0
    - step: CropToMaskStep
      input: wash_reduced_image
      mask: subject_mask
      output: cleaned_image
      parameters:
        background_color: [255, 255, 255]
        padding: 50
        feather_radius: 8
    - step: FinalColorEnhancementStep
      input: cleaned_image
      output: cropped_image
      parameters:
        mode: detail_preserving
        vibrance: 0.25
preview:
  enabled: true
  size: 800
  images:
    - name: cropped_image
      title: Output
      enabled: true
    - name: oriented_image
      title: Oriented Image
      enabled: false
    - name: subject_mask
      title: Subject Mask
      enabled: true
    - name: reduced_yellow_image
      title: Reduced Yellow Image
      enabled: false
